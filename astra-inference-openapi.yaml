openapi: 3.0.3
info:
  title: AstraCompute Inference API
  version: "1.0.0"
  description: Fictional OpenAPI sample for a developer documentation portfolio.
servers:
  - url: https://api.astracompute.example.com
security:
  - bearerAuth: []
paths:
  /v1/inference:
    post:
      summary: Run synchronous inference
      description: Runs a short inference request and returns the model output in the response.
      operationId: runInference
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InferenceRequest"
            example:
              model: astra-small
              input:
                prompt: Explain GPU inference in one sentence.
              max_output_tokens: 100
      responses:
        "200":
          description: Inference completed successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InferenceResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/jobs:
    post:
      summary: Create an asynchronous inference job
      description: Creates a GPU-backed inference job for longer-running workloads.
      operationId: createJob
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobRequest"
      responses:
        "201":
          description: Job created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "400":
          $ref: "#/components/responses/BadRequest"
  /v1/jobs/{job_id}:
    get:
      summary: Get job status
      description: Returns the current status and output for a job.
      operationId: getJob
      parameters:
        - name: job_id
          in: path
          required: true
          description: Unique job ID.
          schema:
            type: string
      responses:
        "200":
          description: Job status returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "404":
          description: Job not found.
    delete:
      summary: Cancel a job
      description: Cancels a queued or running job.
      operationId: cancelJob
      parameters:
        - name: job_id
          in: path
          required: true
          description: Unique job ID.
          schema:
            type: string
      responses:
        "204":
          description: Job canceled.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    InferenceRequest:
      type: object
      required:
        - model
        - input
      properties:
        model:
          type: string
          example: astra-small
        input:
          type: object
          required:
            - prompt
          properties:
            prompt:
              type: string
              example: Explain GPU inference in one sentence.
        max_output_tokens:
          type: integer
          default: 256
          minimum: 1
          maximum: 4096
    JobRequest:
      allOf:
        - $ref: "#/components/schemas/InferenceRequest"
        - type: object
          properties:
            gpu_type:
              type: string
              enum:
                - T4
                - L4
                - A100
              example: A100
    InferenceResponse:
      type: object
      properties:
        id:
          type: string
          example: inf_8a82c91f
        status:
          type: string
          example: completed
        model:
          type: string
          example: astra-small
        output:
          type: object
          properties:
            text:
              type: string
        usage:
          $ref: "#/components/schemas/Usage"
    Job:
      type: object
      properties:
        id:
          type: string
          example: job_4f73a8d2
        status:
          type: string
          enum:
            - queued
            - running
            - completed
            - failed
            - canceled
        model:
          type: string
        gpu_type:
          type: string
        created_at:
          type: string
          format: date-time
        output:
          type: object
          properties:
            text:
              type: string
        usage:
          $ref: "#/components/schemas/Usage"
    Usage:
      type: object
      properties:
        input_tokens:
          type: integer
        output_tokens:
          type: integer
        gpu_seconds:
          type: number
          format: float
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            request_id:
              type: string
  responses:
    BadRequest:
      description: Invalid request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing or invalid API key.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: Too many requests.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
